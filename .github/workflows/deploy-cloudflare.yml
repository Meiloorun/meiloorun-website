name: Build and deploy Cloudflare

on:
  push:
    branches: [cloudflare]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Tracker credentials are runtime Worker secrets, never build inputs.
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Deploy Worker and update runtime secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ${{ secrets.ANILIST_USERNAME != '' && 'ANILIST_USERNAME' || '' }}
            ${{ secrets.LASTFM_USERNAME != '' && 'LASTFM_USERNAME' || '' }}
            ${{ secrets.LASTFM_API_KEY != '' && 'LASTFM_API_KEY' || '' }}
            ${{ secrets.SIMKL_CLIENT_ID != '' && 'SIMKL_CLIENT_ID' || '' }}
            ${{ secrets.SIMKL_CLIENT_SECRET != '' && 'SIMKL_CLIENT_SECRET' || '' }}
            ${{ secrets.SIMKL_REFRESH_TOKEN != '' && 'SIMKL_REFRESH_TOKEN' || '' }}
            ${{ secrets.SIMKL_ACCESS_TOKEN != '' && 'SIMKL_ACCESS_TOKEN' || '' }}
            ${{ secrets.SIMKL_PROFILE_URL != '' && 'SIMKL_PROFILE_URL' || '' }}
            ${{ secrets.IGDB_GAME_ID != '' && 'IGDB_GAME_ID' || '' }}
            ${{ secrets.IGDB_CLIENT_ID != '' && 'IGDB_CLIENT_ID' || '' }}
            ${{ secrets.IGDB_CLIENT_SECRET != '' && 'IGDB_CLIENT_SECRET' || '' }}
            ${{ secrets.INFINITE_BACKLOG_PROFILE_URL != '' && 'INFINITE_BACKLOG_PROFILE_URL' || '' }}
            ${{ secrets.BATCAVE_PROFILE_URL != '' && 'BATCAVE_PROFILE_URL' || '' }}
            ${{ secrets.BATCAVE_EMBED_URL != '' && 'BATCAVE_EMBED_URL' || '' }}
        env:
          ANILIST_USERNAME: ${{ secrets.ANILIST_USERNAME }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_REFRESH_TOKEN: ${{ secrets.SIMKL_REFRESH_TOKEN }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          SIMKL_PROFILE_URL: ${{ secrets.SIMKL_PROFILE_URL }}
          IGDB_GAME_ID: ${{ secrets.IGDB_GAME_ID }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          INFINITE_BACKLOG_PROFILE_URL: ${{ secrets.INFINITE_BACKLOG_PROFILE_URL }}
          BATCAVE_PROFILE_URL: ${{ secrets.BATCAVE_PROFILE_URL }}
          BATCAVE_EMBED_URL: ${{ secrets.BATCAVE_EMBED_URL }}
